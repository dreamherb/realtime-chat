include classpath("application.conf")

# host=* → 컨테이너(elasticmq) / 호스트(localhost) 양쪽 Queue URL 허용
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  chat-message-created {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
  }
}
